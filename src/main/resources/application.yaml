spring:
  jmx:
    enabled: true
  config:
    import: "optional:consul:localhost:8500"
    activate:
      on-profile: consul
  application:
    name: k-producer
  cloud:
    consul:
      host: localhost
      port: 8500
      scheme: http
      config:
        acl-token: anonymous
        enabled: true
        # `optional:` on the import covers "no config at that path"; this covers "cannot reach
        # Consul at all". Both are needed for the app to run in an environment without Consul -
        # it falls back to the configuration bundled in the jar and logs a warning.
        fail-fast: false
      discovery:
        # See the note in the test profile: registration failure is its own fail-fast switch.
        fail-fast: false
        tags: app
        health-check-interval: 15s
        health-check-url: http://app.podspace.internal:${server.port}/actuator/health
        metadata:
          metrics-path: /actuator/prometheus
