spring:
  jmx:
    enabled: true
  config:
    import: "optional:consul:localhost:8500"
    activate:
      on-profile: consul
  application:
    name: k-producer
  cloud:
    consul:
      host: localhost
      port: 8500
      scheme: http
      config:
        acl-token: anonymous
        enabled: true
        # Has no effect while the import above carries `optional:`. That prefix swallows every
        # config-data failure, an unreachable server included, and it does so before this is
        # consulted - setting `fail-fast: true` here does not change the outcome, as a run against
        # an untrusted Consul endpoint confirms: the application starts on the configuration
        # bundled in this file either way, and logs a warning. Dropping `optional:` is what makes
        # the failure fatal, which is what the `ext` profile at the end of this file does. Kept
        # explicit here because tolerating a missing Consul is the intended behaviour for these
        # profiles, and this states it.
        fail-fast: false
      discovery:
        # See the note in the test profile: registration failure is its own fail-fast switch.
        fail-fast: false
        tags: app
        health-check-interval: 15s
        health-check-url: http://app.podspace.internal:${server.port}/actuator/health
        metadata:
          metrics-path: /actuator/prometheus

---
# The `ext` profile selects the Consul prefix for the EXTERNAL listener on 9094 - TLS, public
# podspace.net broker names (see terraform/main.tf). It carries no connection details of its own and
# is always combined with a profile that supplies them: `SPRING_PROFILES_ACTIVE=consul,ext`. This
# document is last in the file so that, with both active, the setting below wins over the `consul`
# profile's `fail-fast: false`.
#
# Unlike `dev` or `test`, this profile has no useful degraded mode. When the configuration cannot be
# read, the application falls back to the values bundled in this file - `localhost:9092`, PLAINTEXT -
# so a probe started to measure a TLS cluster instead measures a broker that is not under test, and
# reports a healthy run while doing it. Refusing to start is strictly more useful than a confident
# answer about the wrong cluster. Check the `bootstrap.servers` line logged at start-up to tell the
# two apart.
#
# The usual cause is the JVM not trusting the Consul endpoint's private CA, which surfaces as
# `PKIX path building failed`; see "Trusting the Consul endpoint itself" in README.md.
#
# Deliberately scoped to config only. `discovery.fail-fast` stays false: failing to register with
# Consul costs the instance its service entry, but it does not change what is being measured.
spring:
  config:
    # NOT `optional:`, unlike every other profile here - and that prefix, not `fail-fast`, is what
    # decides this. `optional:` swallows an unreachable Consul just as readily as an empty path, and
    # it does so before `fail-fast` is ever consulted: with `optional:` present the application
    # starts on the bundled defaults even with `fail-fast: true` set on the command line. Bare
    # `consul:` takes its host and port from `spring.cloud.consul.*` below, so this composes with
    # whichever profile supplies the connection rather than pinning one here.
    import: "consul:"
    activate:
      on-profile: ext
  cloud:
    consul:
      config:
        # Belt and braces. The import above is what actually enforces this today; this covers the
        # case of someone reintroducing `optional:` without realising what it turns off.
        fail-fast: true
