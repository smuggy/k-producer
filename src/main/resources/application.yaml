---
management:
  endpoint:
    # `access` replaces the per-endpoint `enabled` flag deprecated in Boot 3.4.
    # health/info/metrics are enabled by default, so they no longer need declaring at all;
    # shutdown is off by default and must be turned on explicitly.
    shutdown:
      access: unrestricted
    health:
      # Internal diagnostic tool with everything already exposed; the relay counters are the
      # point of the indicator, so surface them rather than hiding behind the default "never".
      show-details: always
      probes:
        enabled: true
      # The relay contributor only exists in the echo role, so the readiness group would fail
      # validation in every other role.
      validate-group-membership: false
      group:
        # Liveness deliberately excludes the relay: a relay in backoff means the brokers are
        # unreachable, not that this process is broken. Restarting on that would produce restart
        # storms during the very outage being measured.
        # `include` is a Set<String>, so list syntax rather than a comma-separated string:
        # relaxed binding accepts both, but only this form type-checks in an IDE.
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - relay
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
#    access:
#      default: none    # replaces the deprecated management.endpoints.enabled-by-default
---
myapp:
  messenger: kafka
  # loopback | origin | echo. loopback publishes and consumes one topic in this process and
  # measures one-way latency. origin/echo split that across two instances and two topics so the
  # round trip is timed on a single clock - see the single-instance note in the README.
  role: loopback
  # Availability zone this instance runs in; tagged onto every metric so an origin in one zone and
  # an echo in another can be compared. Set per deployment.
  az: unknown
  # Identifies this instance on every metric. Defaults to the container hostname - the pod name
  # under Kubernetes, the container id under Docker - and falls back to "unknown" when running
  # outside a container, where HOSTNAME is usually not exported to the JVM. Declared here rather
  # than left implicit in MetricsConfig so the property is discoverable.
  instance: ${HOSTNAME:unknown}
  publisher:
    messageCount: 5
    sleep: 10
    fillerSize: 512
  kafka:
    topicName: test-topic-one
    # Return leg for the origin/echo roles; must differ from topicName or the relay would
    # re-consume its own output. Unused by the loopback role.
    echoTopicName: test-topic-echo
    groupId: test-group-id
    # latest = measure from now (correct for latency runs); earliest = read the whole backlog
    # first (use when checking for lost messages, and expect a large first-pass latency).
    autoOffsetReset: latest
    # Deliberately a local default so a fresh checkout runs anywhere. Override per environment
    # via an external config file, Consul, or MYAPP_KAFKA_BOOTSTRAPADDRESS - never by editing
    # this file, which is baked into the jar.
    bootstrapAddress: localhost:9092
    acks: "all"
---
spring:
  jmx:
    enabled: true
  config:
    activate:
      on-profile: default,dev
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false
---
