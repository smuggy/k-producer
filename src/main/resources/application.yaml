spring:
  jmx:
    enabled: true
  config:
    import: "consul:localhost:8500"
    activate:
      on-profile: consul
  application:
    name: k-producer
  cloud:
    consul:
      host: localhost
      port: 8500
      scheme: http
      config:
        acl-token: anonymous
        enabled: true
      discovery:
        tags: app
        health-check-interval: 15s
        health-check-url: http://app.podspace.internal:${server.port}/actuator/health
        metadata:
          metrics-path: /actuator/prometheus
