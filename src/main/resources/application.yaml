    enabled: true
  config:
    import: "consul:consul.ps.internal:8500"
    activate:
      on-profile: test
  application:
    name: k-producer
  cloud:
    consul:
      host: consul.ps.internal
      port: 8500
      scheme: http
      config:
        acl-token: anonymous
        enabled: true
        format: yaml
      discovery:
        health-check-interval: 15s
        health-check-url: http://k-producer.ps.internal/actuator/health
