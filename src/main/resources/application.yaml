---
management:
  endpoint:
    # `access` replaces the per-endpoint `enabled` flag deprecated in Boot 3.4.
    # health/info/metrics are enabled by default, so they no longer need declaring at all;
    # shutdown is off by default and must be turned on explicitly.
    shutdown:
      access: unrestricted
    health:
      # Internal diagnostic tool with everything already exposed; the relay counters are the
      # point of the indicator, so surface them rather than hiding behind the default "never".
      show-details: always
      probes:
        enabled: true
      # On, so a typo or a renamed contributor fails startup instead of silently dropping out of
      # the readiness group and leaving it permanently UP. This is only possible because all three
      # engine contributors are registered in every role - see relayHealthIndicator in AppConfig.
      validate-group-membership: true
      group:
        # Liveness deliberately excludes the relay: a relay in backoff means the brokers are
        # unreachable, not that this process is broken. Restarting on that would produce restart
        # storms during the very outage being measured.
        # `include` is a Set<String>, so list syntax rather than a comma-separated string:
        # relaxed binding accepts both, but only this form type-checks in an IDE.
        liveness:
          include:
            - livenessState
        # One contributor per pipeline engine. publisher and consumer exist in every role; relay
        # only in the echo role, which is what validate-group-membership above tolerates. An
        # engine that has not been started reports UP - it is idle, not broken, and a pod whose
        # readiness depended on a manual /publisher/start could never become ready at all.
        readiness:
          include:
            - readinessState
            - publisher
            - consumer
            - relay
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
#    access:
#      default: none    # replaces the deprecated management.endpoints.enabled-by-default
---
myapp:
  messenger: kafka
  # loopback | origin | echo. loopback publishes and consumes one topic in this process and
  # measures one-way latency. origin/echo split that across two instances and two topics so the
  # round trip is timed on a single clock - see the single-instance note in the README.
  role: loopback
  # Availability zone this instance runs in; tagged onto every metric so an origin in one zone and
  # an echo in another can be compared. Set per deployment.
  az: unknown
  # Identifies this instance on every metric. Defaults to the container hostname - the pod name
  # under Kubernetes, the container id under Docker - and falls back to "unknown" when running
  # outside a container, where HOSTNAME is usually not exported to the JVM. Declared here rather
  # than left implicit in MetricsConfig so the property is discoverable.
  #
  # Emitted as the metric label `probe_instance`, NOT `instance`: Prometheus attaches its own
  # `instance` label for the scrape target, and a collision gets ours silently renamed to
  # `exported_instance`. See MetricsConfig.
  instance: ${HOSTNAME:unknown}
  # Headless verification mode, off unless myapp.verify.messages is set. Publishes that many
  # messages, waits for the pipeline to drain, reconciles, prints a summary and exits:
  #   0 = every published message was delivered
  #   1 = messages were lost
  #   2 = inconclusive - the run could not be completed, so no verdict is claimed
  # Keeping "lost messages" and "could not reach the brokers" as different codes matters: they
  # call for different responses from whatever is reading the exit status.
  #   java -jar k-producer.jar --myapp.verify.messages=5000
  # Add --myapp.verify.quiet=true to suppress all logging and print one parseable summary line.
  # verify:
  #   messages: 5000
  #   timeoutSeconds: 120
  #   drainSeconds: 30
  # json | avro. The reading measured is identical either way; this decides only the encoding.
  # JSON is the default because it needs no registry and can be read straight off the topic with
  # kafka-console-consumer, which a probe that has to run anywhere depends on. Avro exercises the
  # schema registry as a real availability dependency alongside the brokers - one that is slow,
  # unreachable or rejecting a schema is a failure mode JSON mode cannot reproduce.
  #
  # The CONSUMER does not need this set: it detects the format per message, because a topic can
  # carry both during a migration and a consumer pinned to one would silently discard the rest.
  payload:
    format: json
  schemaRegistry:
    # Required when payload.format is avro; startup fails without it rather than producing nothing.
    # Also enables Avro DECODING even in json mode, so this instance can read what others publish.
    url: ""
    cacheCapacity: 100
  publisher:
    # Distinct partition keys to cycle through. 0 sends unkeyed, letting Kafka's sticky
    # partitioner place messages - correct for raw throughput. A positive value pins each message
    # to a partition by key hash, which is how to exercise a multi-partition topic deliberately:
    # Kafka orders only within a partition, so with keys an out-of-order arrival is a real finding
    # rather than the expected consequence of spreading traffic.
    keyCount: 0
    messageCount: 5
    sleep: 10
    fillerSize: 512
  kafka:
    topicName: test-topic-one
    # Return leg for the origin/echo roles; must differ from topicName or the relay would
    # re-consume its own output. Unused by the loopback role.
    echoTopicName: test-topic-echo
    groupId: test-group-id
    # latest = measure from now (correct for latency runs); earliest = read the whole backlog
    # first (use when checking for lost messages, and expect a large first-pass latency).
    autoOffsetReset: latest
    # Ceiling on how long a single send may block before throwing. Kafka defaults to 60000, which
    # leaves a broker outage invisible to health for a full minute - the send blocks, nothing
    # throws, and the worker loop records no failure. Lower it further to detect faster, raise it
    # if a slow metadata refresh is being mistaken for an outage.
    maxBlockMs: 10000
    # (Outage timing needs no configuration: kproducer.engine.outage records every recovery, and
    # kproducer.engine.outage.current reports an outage still in progress. See RecoveryMetrics.)
    # Arbitrary client properties, merged verbatim into BOTH the producer and the consumer and
    # applied last, so they override the named settings above. This is how TLS and SASL are
    # configured: enumerating every security property here would mean a code change per mechanism,
    # and this tool exists to probe clusters it does not own.
    #
    # Deliberately empty in the bundled file. Trust material is meaningful only in one
    # environment, and the jar has to start anywhere with no external dependency - so this belongs
    # in a mounted /config/application.yaml, in Consul, or in environment variables. See the
    # `ext` prefix in terraform/main.tf for a worked example against the TLS listener.
    #
    # Use a PEM certificate rather than a JKS/PKCS12 truststore. Kafka has accepted PEM since 2.7,
    # and it removes three things that only exist to serve the keystore format: a password that
    # protects nothing (the file holds public certificates), a `type` that must be stated because
    # the client assumes JKS while modern keytool writes PKCS12 whatever the extension says, and a
    # binary blob that cannot live in configuration.
    #
    # properties:
    #   security.protocol: SSL
    #   ssl.truststore.type: PEM
    #   ssl.truststore.location: external-ca.pem
    #
    # Or inline the certificate, so no file has to reach the machine at all - which is how the
    # Consul-configured profiles carry it:
    #
    # properties:
    #   security.protocol: SSL
    #   ssl.truststore.type: PEM
    #   ssl.truststore.certificates: |
    #     -----BEGIN CERTIFICATE-----
    #     ...
    #     -----END CERTIFICATE-----
    #
    # Ceiling on how long an accepted record may go unacknowledged before the send is failed.
    # Kafka defaults to 120000, so a record buffered just before an outage takes two minutes to
    # report. Must be at least linger.ms + request.timeout.ms; with Kafka 4 defaults that is
    # 5 + 30000 = 30005, not 30000 - setting it too low makes every send throw ConfigException.
    deliveryTimeoutMs: 40000
    # Seconds of empty polls before the reader actively checks the cluster is still reachable, by
    # asking the brokers for end offsets. An idle topic and a dead cluster look identical from
    # poll() - both return nothing and throw nothing - and the cached partition assignment does not
    # separate them either, because a client that has lost every broker never learns it lost its
    # partitions. 0 disables the check: commitSync usually detects an outage first, about 15s
    # against a killed broker, but only while there is an offset to commit.
    reachabilityCheckSeconds: 30
    # Deliberately a local default so a fresh checkout runs anywhere. Override per environment
    # via an external config file, Consul, or MYAPP_KAFKA_BOOTSTRAPADDRESS - never by editing
    # this file, which is baked into the jar.
    bootstrapAddress: localhost:9092
    acks: "all"
---
spring:
  jmx:
    enabled: true
  config:
    activate:
      on-profile: default,dev
  cloud:
    bus:
      enabled: false
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false
---
#management:
#  endpoint:
#    shutdown:
#      enabled: true
#    health:
#      enabled: true
#    metrics:
#      enabled: true
#    info:
#      enabled: true
#  observations:
#    annotations:
#      enabled: true
#  endpoints:
#    web:
#      exposure:
#        include: "*"
spring:
  jmx:
    enabled: true
  config:
    import: "optional:consul:consul.ps.internal:8501"
    activate:
      on-profile: test
  application:
    name: k-producer
  cloud:
    consul:
      host: consul.ps.internal
      port: 8501
      scheme: https
      config:
        acl-token: anonymous
        enabled: true
        # Has no effect while the import above carries `optional:`. That prefix swallows every
        # config-data failure, an unreachable server included, and it does so before this is
        # consulted - setting `fail-fast: true` here does not change the outcome, as a run against
        # an untrusted Consul endpoint confirms: the application starts on the configuration
        # bundled in this file either way, and logs a warning. Dropping `optional:` is what makes
        # the failure fatal, which is what the `ext` profile at the end of this file does. Kept
        # explicit here because tolerating a missing Consul is the intended behaviour for these
        # profiles, and this states it.
        fail-fast: false
        # This context really is a single `data` key holding a YAML document
        # (config/k-producer,test/data), so YAML is correct here. Note the consul/ext/other
        # profiles deliberately omit this: their prefixes are provisioned by Terraform as
        # individual subkeys, which is the default KEY_VALUE format. The format must match how
        # each prefix was written, and these two differ.
        format: yaml
      discovery:
        # Registration is a third, separate failure path: `optional:` covers a missing config
        # path, config.fail-fast covers an unreachable config server, and this covers a failed
        # service registration. All three are needed before Consul is genuinely optional.
        fail-fast: false
        health-check-interval: 15s
        health-check-url: http://k-producer.ps.internal/actuator/health
---
