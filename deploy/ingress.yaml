apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k-producer-ingress
  labels:
    app.kubernetes.io/name: k-producer
  annotations:
    # The application serves no root path - the build details it used to report from `/` now come
    # from the actuator. Redirect rather than reintroduce a controller just to serve one string,
    # so that browsing the host lands somewhere useful instead of on a 404.
    nginx.ingress.kubernetes.io/app-root: /actuator/info
spec:
  ingressClassName: nginx
  rules:
    - host: k-producer.ps.internal
      http:
        paths:
          - backend:
              service:
                name: k-producer-service
                port:
                  number: 80
            pathType: Prefix
            path: /
