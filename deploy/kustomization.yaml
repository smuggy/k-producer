apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-ns
# Every manifest belongs here. Only deployment.yaml carries an inline `namespace:`; the rest
# rely on the `namespace` above, so applying them with `kubectl apply -f` puts them in whatever
# namespace happens to be current. Use `kubectl apply -k deploy/`.
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - service_account.yaml
  - rbac.yaml
