apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-producer
  namespace: app-ns
  labels:
    app.kubernetes.io/name: k-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k-producer
        app.kubernetes.io/version: 0.5.1
    spec:
      serviceAccountName: k-producer-sa
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: k-producer-ctr
          image: mmckernan/k-producer:0.5.1
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          # Group-specific paths, not the aggregate /actuator/health: the relay contributes to
          # readiness only, so an unreachable broker takes the pod out of service without
          # restarting it.
          livenessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/liveness
          readinessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/readiness
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Deliberately no cpu limit. A CFS quota throttles the process in bursts, and this
              # application exists to measure latency - throttling would show up as Kafka latency
              # that is not really there. The request reserves capacity without capping it.
              memory: 1Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          env:
            # No profile by default: the bundled application.yaml runs standalone with no
            # Consul. Set this to `test` or `consul` to pull configuration from Consul instead -
            # and even then the import is `optional:`, so an unreachable Consul degrades to the
            # bundled defaults rather than failing to start.
            - name: SPRING_PROFILES_ACTIVE
              value: ""
            # Spring searches ./config/ (the container's working directory is /), so an
            # application.yaml mounted at /config/application.yaml is picked up automatically and
            # overrides the copy baked into the jar. Nothing else to configure.
            # Container-aware defaults cap the heap at 25% of the limit, which would leave ~256Mi
            # here and risk an OOM kill while the heap still looks small.
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
            # run.sh imports every PEM found here into a copy of the JVM trust store. Consul's
            # HTTPS certificate is issued by a private CA the JVM does not ship with, and without
            # this the config import fails with a misleading "resource does not exist".
            - name: CONSUL_CA_DIR
              value: /etc/ssl/consul-ca
            # Explicit rather than relying on HOSTNAME happening to be the pod name: the downward
            # API states the intent, and survives any change in how the runtime sets HOSTNAME.
            - name: MYAPP_INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Real zone comes from the node; overriding per-deployment is fine too.
            - name: MYAPP_AZ
              value: "lab"
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
            - name: consul-ca
              mountPath: /etc/ssl/consul-ca
              readOnly: true
      volumes:
        # Optional environment overrides. Create with, for example:
        #   kubectl -n app-ns create configmap k-producer-config \
        #       --from-file=application.yaml=my-overrides.yaml
        - name: app-config
          configMap:
            name: k-producer-config
            optional: true
        # A CA certificate is public, so a ConfigMap is the right home - only the trust store
        # password is a secret. Create it from the CA you actually issued Consul's cert from:
        #   kubectl -n app-ns create configmap consul-ca \
        #       --from-file=internal-ca.pem=path/to/internal_ca_cert.pem
        - name: consul-ca
          configMap:
            name: consul-ca
            optional: true
