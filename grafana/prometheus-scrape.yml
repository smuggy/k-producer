# Add to the `scrape_configs:` list in prometheus.yml on prometheus.ps.internal (192.168.0.61),
# then reload:  curl -X POST http://localhost:9090/-/reload
#
# The application runs in Kubernetes with a ClusterIP service, so the ingress is the only route
# in from outside the cluster. Prometheus and the ingress sit on the same subnet
# (192.168.0.61 -> 192.168.0.62), so this needs no extra routing.

  - job_name: k-producer
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['k-producer.ps.internal:80']
        labels:
          cluster: local-net-1

    # The application emits its instance identity as `probe_instance` (the pod name, from the
    # downward API) specifically so it does not collide with the `instance` label Prometheus
    # attaches below. Both labels therefore survive: `instance` is the scrape target, and
    # `probe_instance` is the pod. No renaming to `exported_instance` occurs.
    honor_labels: false
