plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.14'
}

group = 'net.podspace'
version = '0.3.4'

repositories {
    mavenCentral()
}

application {
    mainClass = "net.podspace.producer.Main"
}

tasks.register("cleanDockerDirTars", Delete) {
    delete fileTree(layout.buildDirectory.dir("docker")) {
        include "**/*.tar"
    }
}

tasks.register("copyTarToDockerDir", Copy) {
    from layout.buildDirectory.dir("distributions")
    include "**/k-producer-boot-*.tar"
    into layout.buildDirectory.dir("docker")
}
copyTarToDockerDir.dependsOn cleanDockerDirTars

tasks.register("prepareDockerDir", Copy) {
    from layout.projectDirectory.dir("src/main/docker")
    include "**/*"
    filter { it.replaceAll('__app_version__', project.version) }
    into layout.buildDirectory.dir("docker")
}

tasks.register("buildDockerImage", Exec) {
    workingDir layout.getBuildDirectory()
    commandLine "docker", "build", "--build-arg", "APP_VERSION=${project.version}", "--tag", "${project.name}:${project.version}", "docker"
}

tasks.register("tagDockerImage", Exec) {
    workingDir layout.getBuildDirectory()
    commandLine "docker", "image", "tag", "${project.name}:${project.version}", "mmckernan/${project.name}:${project.version}"
}

tasks.register("pushDockerImage", Exec) {
    commandLine "docker", "push", "mmckernan/${project.name}:${project.version}"
}

copyTarToDockerDir.dependsOn build
buildDockerImage.dependsOn prepareDockerDir
buildDockerImage.dependsOn copyTarToDockerDir
tagDockerImage.dependsOn buildDockerImage
pushDockerImage.dependsOn tagDockerImage

dependencies {
    // TODO: stale pin - Boot's BOM upgrades this to 2.0.16 anyway; the 1.7.x number is misleading
    // since log4j-slf4j2-impl requires slf4j 2.x. Drop the explicit version.
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    implementation 'org.apache.logging.log4j:log4j-layout-template-json:2.25.4'

    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.14'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2:3.5.14'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.14'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-all:4.3.3'

    implementation 'org.springframework.kafka:spring-kafka:3.3.16'
    implementation 'org.apache.kafka:kafka-clients:3.9.2'

    // TODO: bug - pinned 1.12.4 is simpleclient-based and incompatible with Boot 3.5.x, which
    // dropped the simpleclient auto-config; no PrometheusMeterRegistry is created and
    // /actuator/prometheus returns 404 (verified). Consul discovery advertises that path as
    // metrics-path. Drop the explicit version so Boot's BOM manages it.
    implementation 'io.micrometer:micrometer-registry-prometheus:1.12.4'

    // TODO: bug (verified) - `./gradlew test` fails outright with "Failed to load JUnit Platform",
    // so the whole suite silently never runs and `build` fails. Gradle 9 no longer injects the
    // launcher implicitly. Fix: add `testRuntimeOnly 'org.junit.platform:junit-platform-launcher'`
    // (confirmed to make the suite run and pass). The 5.9.1 BOM pin also overrides the newer JUnit
    // that Boot 3.5 manages - consider dropping the explicit version too.
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

configurations.implementation {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

test {
    useJUnitPlatform()
}
