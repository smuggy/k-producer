import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'net.podspace'
version = '0.5.1'

// Pin the bytecode/API level to the JRE in the Docker image, whatever JDK runs Gradle. Without
// this the class file version silently tracks the local JDK - a JDK 26 build produced major
// version 70 class files, which an older JRE in the image cannot load at all. Keep this in step
// with the eclipse-temurin tag in src/main/docker/Dockerfile.
tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    mavenCentral()
}

application {
    // Main sits in the root package so @SpringBootApplication component scanning covers every
    // net.podspace.* subpackage (web, config, ...).
    mainClass = "net.podspace.Main"
}

springBoot {
    // Generates META-INF/build-info.properties, which the actuator serves from /actuator/info.
    // Version and build time then come from the build itself rather than from an APP_VERSION
    // environment variable the Dockerfile has to remember to pass through.
    buildInfo()
}

tasks.register("cleanDockerDirTars", Delete) {
    delete fileTree(layout.buildDirectory.dir("docker")) {
        include "**/*.tar"
    }
}

tasks.register("copyTarToDockerDir", Copy) {
    from layout.buildDirectory.dir("distributions")
    include "**/k-producer-boot-*.tar"
    into layout.buildDirectory.dir("docker")
}
copyTarToDockerDir.dependsOn cleanDockerDirTars

tasks.register("prepareDockerDir", Copy) {
    from layout.projectDirectory.dir("src/main/docker")
    include "**/*"
    filter { it.replaceAll('__app_version__', project.version) }
    into layout.buildDirectory.dir("docker")
}

// Docker Desktop, Colima, Rancher and the Linux packages all install the binary somewhere
// different, so the location is a property rather than a hardcoded path:
//   ./gradlew buildDockerImage -PdockerExecutable=/usr/local/bin/docker
// or set dockerExecutable=... in gradle.properties.
def dockerExe = providers.gradleProperty("dockerExecutable").getOrElse("docker")

/**
 * The Gradle daemon captures PATH when it starts and is then reused for hours, so a daemon
 * launched from an environment without docker on its PATH keeps failing even once your shell can
 * find it. On macOS this bites when the daemon was started by an IDE opened from Finder or the
 * Dock, which does not inherit the shell PATH. Gradle's own error for this is just
 * "A problem occurred starting process", which points nowhere, hence the explicit check.
 */
def requireDocker = {
    def probe = providers.exec {
        commandLine "/usr/bin/env", "sh", "-c", "command -v '${dockerExe}'"
        ignoreExitValue = true
    }
    if (probe.result.get().exitValue != 0) {
        throw new GradleException("Docker executable '${dockerExe}' was not found on the Gradle "
                + "daemon's PATH.\n"
                + "  - The daemon caches PATH from whatever started it: try './gradlew --stop' and re-run.\n"
                + "  - Or point at it directly: -PdockerExecutable=/full/path/to/docker")
    }
}

// Override with -PdockerPlatforms=linux/amd64 to publish a single architecture.
def dockerPlatforms = providers.gradleProperty("dockerPlatforms").getOrElse("linux/amd64,linux/arm64")

/**
 * Buildx's default "docker" driver cannot produce multi-platform images; that needs a
 * docker-container builder. Checking up front turns an obscure mid-build failure into an
 * instruction.
 */
def requireMultiArchBuilder = {
    def probe = providers.exec {
        commandLine dockerExe, "buildx", "inspect"
        ignoreExitValue = true
    }
    if (probe.result.get().exitValue != 0) {
        throw new GradleException("'${dockerExe} buildx' is not usable. Buildx ships with Docker "
                + "Desktop; on Linux it may need installing separately.")
    }
    if (probe.standardOutput.asText.get() =~ /(?m)^Driver:\s+docker\s*$/) {
        throw new GradleException("The active buildx builder uses the default 'docker' driver, "
                + "which cannot build multi-platform images.\n"
                + "  Create one that can:  ${dockerExe} buildx create --name multiarch --use --bootstrap")
    }
}

tasks.register("buildDockerImage", Exec) {
    workingDir layout.getBuildDirectory()
    commandLine dockerExe, "build", "--tag", "${project.name}:${project.version}", "docker"
    doFirst { requireDocker() }
}

tasks.register("tagDockerImage", Exec) {
    workingDir layout.getBuildDirectory()
    commandLine dockerExe, "image", "tag", "${project.name}:${project.version}", "mmckernan/${project.name}:${project.version}"
    doFirst { requireDocker() }
}

tasks.register("pushDockerImage", Exec) {
    commandLine dockerExe, "push", "mmckernan/${project.name}:${project.version}"
    doFirst { requireDocker() }
}

/**
 * Builds and publishes one tag covering every platform in dockerPlatforms.
 *
 * <p>A tag points at a single manifest, so pushing the same tag from an amd64 host simply replaces
 * whatever an arm64 host pushed before it - the architectures do not merge. This publishes a
 * manifest list instead, letting each client pull the image matching its own platform.
 *
 * <p>Cross-building is close to free here: the distribution is JVM bytecode and shell scripts,
 * with nothing architecture-specific, and eclipse-temurin is already multi-arch. Buildx just
 * copies the same tar onto each base image - no QEMU emulation of a compiler.
 *
 * <p>Note this pushes directly and produces no local image: buildx cannot load a multi-platform
 * build into the local daemon. Use buildDockerImage for local single-arch iteration.
 */
tasks.register("pushMultiArchImage", Exec) {
    workingDir layout.getBuildDirectory()
    commandLine dockerExe, "buildx", "build",
            "--platform", dockerPlatforms,
            "--tag", "mmckernan/${project.name}:${project.version}",
            "--push", "docker"
    doFirst {
        requireDocker()
        requireMultiArchBuilder()
        logger.lifecycle("Publishing mmckernan/${project.name}:${project.version} for ${dockerPlatforms}")
    }
}

copyTarToDockerDir.dependsOn build
buildDockerImage.dependsOn prepareDockerDir
buildDockerImage.dependsOn copyTarToDockerDir
pushMultiArchImage.dependsOn prepareDockerDir
pushMultiArchImage.dependsOn copyTarToDockerDir
tagDockerImage.dependsOn buildDockerImage
pushDockerImage.dependsOn tagDockerImage

dependencies {
    // Boot's BOM manages versions for everything it knows about (starters, kafka, micrometer,
    // slf4j, log4j, junit), so those are declared without a version below and stay consistent
    // with the Boot release. Declaring a version anywhere below is therefore a deliberate
    // override, not an oversight.
    // BOM_COORDINATES tracks the applied Boot plugin version, so the two cannot drift.
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    // Spring Cloud ships its own train and gates the Boot version: 2025.1.3 targets Boot 4.0.8,
    // so the two must be bumped together. Boot 4.1.x has no matching stable train yet.
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:2025.1.3")

    implementation 'org.slf4j:slf4j-api'
    // Deliberate override: ahead of the log4j version Boot manages.
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    implementation 'org.apache.logging.log4j:log4j-layout-template-json:2.25.4'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // config + discovery only, deliberately NOT -consul-all: that also drags in Spring Cloud Bus
    // and Spring Cloud Stream, which this application never uses and which failed to start under
    // Boot 4 (eventService / inputBindingLifecycle), taking the whole consul profile down with it.
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    // Boot 4 moved Kafka auto-config into its own starter; a bare spring-kafka no longer brings it.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.apache.kafka:kafka-clients'

    // Version comes from the BOM: pinning this independently is what previously left it on a
    // simpleclient-based 1.12.x that Boot 3.5 no longer auto-configures, so /actuator/prometheus
    // returned 404.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Required on the test runtime classpath: Gradle 9 no longer injects the launcher implicitly,
    // and without it the test task fails to start and the whole suite silently never runs.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.implementation {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

test {
    useJUnitPlatform()
}
